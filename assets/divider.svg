<svg width="900" height="6" viewBox="0 0 900 6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15">
        <animate attributeName="offset" values="-1;1;-1" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FF0000">
        <animate attributeName="offset" values="-0.5;1.5;-0.5" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FFFFFF">
        <animate attributeName="offset" values="0;2;0" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="900" height="6" fill="url(#grad)" rx="3" />
</svg>
